:root{
  --bg:#F2F2F5; --paper:#FFFFFF; --card:#FFFFFF; --ink:#34455A; --accent:#8FBFE0; --ink2:#5E6E7B; --ink3:#95A1AA;
  --line:#E2E6EC; --coral:#EBA3B6; --sky:#8EACCD; --soft:#EFEFF3;
  --r:16px; --shadow:0 1px 2px rgba(30,45,70,.06),0 6px 18px -8px rgba(30,45,70,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.en{font-family:"Mont",sans-serif;letter-spacing:.18em;font-weight:600;text-transform:uppercase}

/* ---------- shell ---------- */
.shell{min-height:100svh}
.side{display:none}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar .t{font-weight:800;font-size:15px}
.appbar .dd{font-family:"Anton";color:var(--coral);font-size:18px;letter-spacing:.04em}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:6px 0;border-radius:12px}
.tabbar a.on{color:var(--ink);font-weight:700}
.tabbar a.on .ic{stroke-width:2.2}

/* ---------- common ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.h2{font-size:13px;font-weight:700;color:var(--ink2);margin:26px 2px 10px;display:flex;align-items:center;gap:8px}
.h2::after{content:"";flex:1;height:1px;background:var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.pill.warn{background:#FDE6EC;color:#C0677E}
.pill.ok{background:#EEF1DA;color:#7A8540}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--soft);font-weight:700;font-size:13.5px}
.btn.dark{background:var(--accent);color:#fff}
.muted{color:var(--ink3)}

/* ---------- home ---------- */
.home{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.home>*{min-width:0}
.poster{background:var(--paper);border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 40px -14px rgba(30,45,70,.35)}
.poster svg{display:block;width:100%;height:auto}
.next{display:grid;gap:10px}
.next .k{font-size:12px;font-weight:700;color:var(--coral)}
.next .big{font-size:16px;font-weight:800;line-height:1.35}
.next .row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--soft);border-radius:12px;font-size:14px}
.next .row b{font-weight:800}
.alerts li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
.alerts li:first-child{border-top:0}
.alerts .ic{color:var(--coral);margin-top:2px;width:18px;height:18px}
.alerts a{font-weight:700}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--coral);border-radius:99px}
.daygrid{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.daygrid::-webkit-scrollbar{display:none}
.daygrid .dcard{flex:0 0 148px;scroll-snap-align:start}
.dcard{position:relative;background:var(--card);border-radius:16px;padding:12px 13px;overflow:hidden;display:grid;align-content:start;gap:3px;min-height:128px;border:1.5px solid var(--pc);transition:transform .15s}
.dcard:hover{transform:translateY(-2px)}
.dcard .n{font-family:"Anton";font-size:13px;letter-spacing:.06em;color:var(--rc)}
.dcard .tt{color:#2A3F52}
.dcard .d{color:var(--rc)!important;opacity:.85}
.dcard .d{font-size:12px;color:var(--ink3);font-weight:600}
.dcard .tt{font-weight:800;font-size:14px;line-height:1.35}
.dcard .h{font-size:11.5px;color:#6B7A86;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.08);display:flex;gap:4px;align-items:center}
.dcard .h .ic{width:13px;height:13px}
.dcard.today{border-color:var(--rc)}

/* ---------- day ---------- */
.chips{position:sticky;top:53px;z-index:15;margin:-16px -16px 14px;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;background:rgba(243,245,248,.95);backdrop-filter:blur(8px);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:grid;justify-items:center;min-width:52px;padding:6px 8px;border-radius:14px;background:var(--card);font-size:11px;color:var(--ink2);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.chip b{font-size:15px;color:var(--ink);font-weight:800}
.chip.on{background:var(--accent);color:#EAF4FB}
.chip.on b{color:#fff}
.chip i{width:6px;height:6px;border-radius:9px;background:var(--rc);margin-top:3px}
.dayhead{padding:0 2px 4px}
.dayhead .eb{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink2)}
.dayhead .eb .n{font-family:"Anton";color:rgba(35,50,70,.78);background:var(--rc);padding:2px 9px;border-radius:8px;letter-spacing:.06em;font-weight:400}
.dayhead h1{font-size:20px;font-weight:800;margin:4px 0 0;line-height:1.25;letter-spacing:-.01em}
.stay{display:flex;align-items:center;gap:8px;font-size:13.5px;background:var(--card);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);flex-wrap:wrap}
.stay .ic{color:#E9A77A}
.stay .note{margin-left:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E6E9EF;border-radius:12px;padding:4px;margin:8px 0 10px}
.seg button{padding:8px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink2);display:flex;gap:6px;justify-content:center;align-items:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.daybody{display:grid;gap:16px}
.tl{position:relative;display:grid;gap:4px}
.ti{display:grid;grid-template-columns:44px 20px 1fr;gap:10px;align-items:start;position:relative;padding:8px 0}
.ti .tm{font-size:10px;font-weight:700;color:var(--ink2);text-align:right;padding-top:13px;font-variant-numeric:tabular-nums}
.ti .dot{justify-self:center;width:11px;height:11px;margin-top:17px;border-radius:50%;background:var(--card);border:2px solid var(--cd);position:relative;z-index:1;box-shadow:0 0 0 4px var(--bg)}
.ti .dot.num{width:22px;height:22px;margin-top:11px;border:0;background:var(--cd);color:var(--ct);display:grid;place-items:center;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.ti .dot .ic{width:17px;height:17px}
.ti:not(:last-child)::after{content:"";position:absolute;left:63.25px;top:34px;bottom:-14px;border-left:1.5px solid #DCDFE7}
.ti .body{background:var(--card);border-radius:14px;padding:9px 11px;box-shadow:var(--shadow)}
.ti .nm{font-weight:500;font-size:12px;line-height:1.4;color:var(--ink)}
.ti .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.ti .memo{font-size:11px;color:var(--ink2);margin-top:6px;white-space:pre-wrap}
.ti.transit .nm{font-variant-numeric:tabular-nums}
.act{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink);padding:2px 7px;border-radius:8px;background:var(--soft)}
.act .ic{width:13px;height:13px}
.info{display:grid;gap:10px}
.info .card h3{font-size:13px;color:var(--ink2);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.meal{display:grid;grid-template-columns:44px 1fr;font-size:14px;padding:3px 0}
.meal span{color:var(--ink3);font-weight:700;font-size:12.5px;padding-top:1px}
.guide{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.guide svg{display:block;width:100%;height:auto}
.guide .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:12.5px}
.daynav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.daynav a{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);font-size:13px}
.daynav a:last-child{text-align:right}
.daynav small{display:block;color:var(--ink3);font-weight:700;font-size:11px}
.web-only{display:none}

  saveCache(); TRIP = id; store.set('trip', id); setDates(); splash = true;
  if (MODE === 'demo'){ D = store.get('demo.' + id, null) || (id === 'honewmoon' ? SEED : null); location.hash = '#home'; route(); return; }
  D = store.get('cache.' + id, null); location.hash = '#home'; route(); load();
}

function tripImg(i, input){
  const f = input.files && input.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = async () => {
    const w = Math.min(1000, im.width), h = Math.round(im.height * w / im.width); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
    const url = c.toDataURL('image/jpeg', .84);
    if (MODE === 'demo'){ TFORM.imgs[i] = url; }
    else { toast('\uadf8\ub9bc\uc744 \uc62c\ub9ac\ub294 \uc911\u2026');
      try { const r = await call('upload', {name:'poster-' + Date.now() + '.jpg', mime:'image/jpeg', data:url.split(',')[1]}); const m = String(r.file.url).match(/[-\w]{25,}/);
        TFORM.imgs[i] = m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w1200` : r.file.url; }
      catch(e){ return toast('\uc5c5\ub85c\ub4dc \uc2e4\ud328: ' + errMsg(e)); } }
    $('#timg' + i).innerHTML = `<img src="${esc(posterImg(TFORM.imgs[i]))}" alt="">`; };
    im.src = rd.result; }; rd.readAsDataURL(f);
}
async function saveTrip(ev){
  ev.preventDefault(); const v = formVals(); const old = TFORM.id ? TRIPS.find(x => x.id === TFORM.id) : null;
  const secs = [0, 1].map(i => ({name:(v['s' + i + 'name'] || '').trim().toUpperCase(), sub:(v['s' + i + 'sub'] || '').trim().toUpperCase(), nights:v['s' + i + 'nights'] ? +v['s' + i + 'nights'] : '', img:TFORM.imgs[i] || ''})).filter(s => s.name || s.img);
  const t = {...(old || {}), title:v.title.trim(), en:(v.en || '').trim(), secs:JSON.stringify(secs), route:(v.route || '').trim().toUpperCase(), via:(v.via || '').trim().toUpperCase()};
  if (!old){ t.start = v.start; t.end = v.end; if (t.end < t.start) return toast('\uadc0\uad6d\uc77c\uc774 \ucd9c\ubc1c\uc77c\ubcf4\ub2e4 \ube68\ub77c\uc694'); }
  closeSheet();
  if (old){ applyLocal('trips', t); route(); return persist('upsert', {table:'trips', row:t}, '\ud3ec\uc2a4\ud130\ub97c \uc800\uc7a5\ud588\uc5b4\uc694'); }
  if (MODE === 'demo'){
    t.id = 't' + Math.random().toString(36).slice(2, 8); TRIPS.push(t);
    const days = []; const WD = ['\uc77c','\uc6d4','\ud654','\uc218','\ubaa9','\uae08','\ud1a0']; for (let d = new Date(t.start + 'T00:00:00'), n = 1; d <= new Date(t.end + 'T00:00:00'); d.setDate(d.getDate() + 1), n++)
      days.push({day:n, date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, weekday:WD[d.getDay()], region:'', title:'', hotel:'', hotel_files:[]});
    const pk = v.copyPacking ? D.packing.map(p => ({...p, id:uid('pa'), checked:false})) : [];
    store.set('demo.' + t.id, {days, plans:[], expenses:[], packing:pk, places:[], tips:[], settings:D.settings}); store.set('demoTrips', TRIPS);
    toast('\uc0c8 \uc5ec\ud589\uc744 \ub9cc\ub4e4\uc5c8\uc5b4\uc694 (\ubbf8\ub9ac\ubcf4\uae30)'); return switchTrip(t.id);
  }
  setSync('saving');
  try { const r = await call('createTrip', {trip:t, copyPacking:!!v.copyPacking}); TRIPS.push(r.trip); setSync('ok'); toast('\uc0c8 \uc5ec\ud589\uc744 \ub9cc\ub4e4\uc5c8\uc5b4\uc694'); switchTrip(r.trip.id); }
  catch(e){ setSync('error'); toast('\ub9cc\ub4e4\uae30 \uc2e4\ud328: ' + errMsg(e)); }
}
async function delTrip(id){
  if (!confirm('\uc774 \uc5ec\ud589 \uc815\ubcf4\ub97c \ubaa9\ub85d\uc5d0\uc11c \uc9c0\uc6b8\uae4c\uc694? (\uc77c\uc815\u00b7\uc608\uc0b0 \uae30\ub85d\uc740 \uc2dc\ud2b8\uc5d0 \ub0a8\uc544\uc694)')) return;
  closeSheet(); TRIPS = TRIPS.filter(x => x.id !== id); if (TRIP === id) await switchTrip('honewmoon'); else route();
  persist('remove', {table:'trips', id}, '\ubaa9\ub85d\uc5d0\uc11c \uc9c0\uc6e0\uc5b4\uc694');
}

function parseCoords(s){
  s = String(s||'').trim(); if (!s) return [null, null];
  const pats = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i, /^\(?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)?$/];
  for (const re of pats){ const m = s.match(re); if (m){ const a = +m[1], b = +m[2]; if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return [a, b]; } }
  return false;
}
