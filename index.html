:root{--bg:#F2F2F5;--paper:#F8F4EB;--ink:#34455A;--ink2:#5E6E7B;--ink3:#95A1AA;--line:#E2E6EC;--shadow:0 1px 2px rgba(30,45,70,.06),0 6px 18px -8px rgba(30,45,70,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

/* ---------- 첫 화면 (비밀번호) ---------- */
.lp{position:fixed;inset:0;overflow:hidden;background:var(--paper);z-index:10;transition:opacity .5s}
.lp.out{opacity:0;pointer-events:none}
.lp::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.65),transparent 45%),radial-gradient(circle at 70% 85%,rgba(255,255,255,.5),transparent 50%)}
.lp .i,.lp .s{position:absolute;pointer-events:none}
.lp .c{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:8px;text-align:center;width:min(340px,86vw)}
.lp .logo{width:236px;display:block}
.lp .c p{font-size:13px;color:var(--ink2);letter-spacing:-.01em}
.lpw{display:flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.8);border:1px solid #E6DFD0;border-radius:999px;padding:5px 5px 5px 18px;box-shadow:0 6px 18px -10px rgba(52,69,90,.35);width:100%;max-width:300px}
.lpw input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:0}
.lpw button{width:40px;height:40px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.lpw button:disabled{opacity:.5}
.lp .err{font-size:12.5px;font-weight:700;color:#C25B42;min-height:16px}
.lp .hint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:#A3A9AE}
/* 소품 배치: 폰 */
.d-plane{width:104px;left:7%;top:7%;transform:rotate(-6deg)}
.d-speed{left:1.5%;top:11.5%}
.d-cl1{left:39%;top:14%}.d-cl2{left:31%;top:19%}
.d-pass{width:96px;right:6%;top:7%;transform:rotate(8deg)}
.d-map{width:94px;left:4%;top:27%;transform:rotate(-7deg)}
.d-cam{width:84px;right:6%;top:28%;transform:rotate(5deg)}.d-ray{right:4%;top:26%}
.d-sign{width:78px;left:5%;top:69%;transform:rotate(-4deg)}
.d-beach{width:96px;right:4%;top:68%}
.d-opera{width:118px;left:4%;bottom:9%}
.d-lug{width:82px;left:44%;bottom:7%;transform:rotate(4deg)}
.d-lake{width:74px;right:7%;bottom:14%;transform:rotate(7deg)}
.d-lupin{width:44px;right:24%;bottom:18%;transform:rotate(-8deg)}
.d-wave{right:5%;bottom:5%}
@media (max-height:700px){.d-map,.d-cam{top:24%}.d-sign,.d-beach{top:72%}.d-lake,.d-lupin{display:none}}
@media (min-width:960px){
  .lp .hint{display:none}
  .lp .c{top:48%;width:420px}.lp .logo{width:340px}.lp .c p{font-size:14.5px}
  .d-plane{width:108px;left:14%;top:12%}.d-speed{left:10.5%;top:17%}
  .d-cl1{left:28%;top:18%}.d-cl2{left:25.5%;top:26%}
  .d-pass{width:100px;right:16%;top:10%}.d-coast{display:block!important;width:80px;right:3%;top:6%}
  .d-map{width:98px;left:8.5%;top:39%}.d-cam{width:90px;right:10.5%;top:38%}.d-ray{right:9.5%;top:34%}
  .d-sign{width:80px;left:23%;top:62%}.d-beach{width:98px;right:23.5%;top:60%}
  .d-opera{width:122px;left:10%;bottom:9%}.d-lug{width:80px;left:45%;bottom:5%}
  .d-lake{width:75px;right:12.5%;bottom:11%}.d-lupin{width:45px;right:22%;bottom:7%}.d-wave{right:4%;bottom:6%}
}

/* ---------- 열린 뒤 ---------- */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:#fff;border-bottom:1px solid var(--line)}
.bar .logo{height:30px;display:block}
.bar .tag{display:none;font-size:13px;color:var(--ink2)}
.bar .btns{display:flex;gap:6px}
.pill{display:inline-flex;gap:5px;align-items:center;border:1.2px dashed #C8CED8;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;background:transparent}
.pill:hover{color:var(--ink);border-color:#9AA6B4}
.pill.solid{border-style:solid;border-color:var(--ink);color:var(--ink)}
.pill svg{width:14px;height:14px}
main{max-width:1500px;margin:0 auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.pt{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:18px 16px 12px}
.pt h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pt small{display:block;font-size:12px;color:var(--ink3);font-weight:500;margin-top:3px}
.card{background:#fff;border-radius:16px;box-shadow:var(--shadow)}
.mapc{margin:0 14px;padding:10px;position:relative}
.mapw{position:relative;overflow:hidden;border-radius:10px}
.mapw svg{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:2px;cursor:pointer;padding:4px}
.pin .fl{width:18px;height:13px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1.5px #fff,0 2px 5px -1px rgba(30,45,70,.45);background:#fff center/122% no-repeat;display:grid;place-items:center;font-size:7px;font-weight:800;color:#fff}
.pin .lb{font-size:9.5px;font-weight:800;background:#fff;color:var(--ink);border-radius:999px;padding:2px 6px;box-shadow:0 2px 6px -2px rgba(30,45,70,.35);white-space:nowrap}
.pin .tip{width:1.5px;height:5px;background:var(--ink);border-radius:2px;margin-top:-2px}
.pin.on .fl{box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--ink),0 4px 10px -2px rgba(30,45,70,.5)}
.pin.on .lb{background:var(--ink);color:#fff}
.mapc .full{position:absolute;right:18px;bottom:18px;background:#fff}
.stats{margin:10px 14px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stats small{font-size:11px;color:var(--ink3);font-weight:700}.stats b{display:block;font-size:17px;font-weight:800;margin-top:2px}
.sec{padding:16px 16px 8px;display:flex;align-items:baseline;gap:8px}
.sec b{font-size:14px;font-weight:800}.sec span{font-size:12px;color:var(--ink3)}
.trow{margin:0 14px 10px;display:flex;gap:12px;align-items:center;padding:10px;transition:transform .15s}
.trow:active{transform:scale(.99)}
.trow .th{width:68px;height:68px;border-radius:12px;overflow:hidden;flex:none}.trow .th svg{width:100%;height:100%;display:block}
.trow .tx{flex:1;min-width:0}.trow .tx b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trow .tx small{font-size:12px;color:var(--ink3)}
.dtag{font-size:11px;font-weight:800;color:#C2607A;background:#FBEAF0;border-radius:999px;padding:3px 8px;white-space:nowrap}
.dtag.gray{color:var(--ink2);background:#EFEFF3}.dtag.on{color:#3F7A4F;background:#E5F2E6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:0 14px}
.tcard{overflow:hidden;display:block}.tcard svg{display:block;width:100%;height:auto}.tcard .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 10px 10px;font-size:12px;color:var(--ink2)}
.tcard .edit{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);flex:none}.tcard .edit:hover{background:#EFEFF3;color:var(--ink)}.tcard .edit svg{width:14px;height:14px}.tcard .ft span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newc{border:1.5px dashed #C8CED8;border-radius:16px;display:grid;place-items:center;align-content:center;gap:8px;color:var(--ink2);font-size:13px;font-weight:700;min-height:170px}
.newc img{width:56px}
.empty{margin:0 14px;padding:22px;text-align:center;color:var(--ink3);font-size:13px}
.foot{text-align:center;margin-top:26px;font-size:11.5px;color:var(--ink3)}
.foot button{text-decoration:underline;color:var(--ink3);font-size:11.5px}
.loading{padding:60px 0;text-align:center;color:var(--ink3);font-size:13px}
@media (min-width:960px){
  .bar{padding:16px 32px}.bar .logo{height:40px}.bar .tag{display:block}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding:0 32px}
  .wrap .pt{padding:24px 0 12px}.wrap .mapc{margin:0;padding:12px}
  .side{padding-top:84px}.side .stats{margin:0}.side .sec{padding:18px 2px 8px}.side .trow{margin:0 0 10px}
  .mapc .full{display:none}
  .grid{margin:0 32px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .listpt{padding:24px 32px 14px!important}
  .pin .fl{width:20px;height:14px}
}
</style>
</head>

  return [(lon + 30) / 360 * WW, (m(83) - m(lat)) / (m(83) - m(-57)) * WH]; };
function mapSVG(places, sel, crop){
  const [cx, cy, cw, ch] = crop || [0, 0, WW, WH];
  const grat = [-40,-20,0,20,40,60].map(la => { const y = PROJ(0, la)[1]; return `<line x1="${cx}" x2="${cx + cw}" y1="${y}" y2="${y}"/>`; }).join('');
  const pins = places.map(p => { const [x, y] = PROJ(p.ll[1], p.ll[0]); const fl = IMG.f[p.f];
    return `<button class="pin ${p.k === sel ? 'on' : ''}" data-k="${p.k}" style="left:${(x - cx) / cw * 100}%;top:${(y - cy) / ch * 100}%" aria-label="${esc(p.n)}"><span class="fl" style="${fl ? `background-image:url(${fl})` : 'background:#8EACCD'}">${fl ? '' : esc(p.k)}</span><span class="lb">${esc(p.n)}</span><i class="tip"></i></button>`; }).join('');
  return `<div class="mapw"><svg viewBox="${cx} ${cy} ${cw} ${ch}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="#F7F9FB"/>
    <g stroke="#EDF1F5" stroke-width="${.8 * cw / WW}">${grat}</g><path d="${WORLD}" fill="#E4EAF0" stroke="#D5DDE6" stroke-width="${.6 * cw / WW}" stroke-linejoin="round"/></svg>${pins}</div>`;
}
function cropFor(places){ // 폰: 핀들이 보이게 적당히 잘라서 크게
  if (!places.length) return null;
  const xs = [], ys = []; places.forEach(p => { const [x, y] = PROJ(p.ll[1], p.ll[0]); xs.push(x); ys.push(y); });
  let w = Math.max(...xs) - Math.min(...xs) + WW * .32, mx = (Math.max(...xs) + Math.min(...xs)) / 2; w = Math.min(WW, Math.max(w, WW * .42));
  let h = w * .78; if (h > WH){ h = WH; w = h / .78; }
  let my = (Math.max(...ys) + Math.min(...ys)) / 2; let x0 = Math.min(WW - w, Math.max(0, mx - w / 2)), y0 = Math.min(WH - h, Math.max(0, my - h / 2 - h * .08));
  return [x0, y0, w, h];
}

/* ---------- 상태 ---------- */
let TRIPS = store.get('trips', []), VIEW = 'map', SEL = null, FULL = false;
const isWeb = () => matchMedia('(min-width:960px)').matches;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const days = t => Math.max(1, Math.round((new Date(t.end) - new Date(t.start)) / 864e5) + 1);
const nights = t => { const span = days(t) - 1, sn = tripSecs(t).reduce((a, s) => a + (+s.nights || 0), 0); return sn > 0 && sn <= span ? sn : span; };
function dtag(t){ const k = today(); if (!t.start) return '';
  if (k < t.start){ const n = Math.round((new Date(t.start) - new Date(k)) / 864e5); return `<span class="dtag">D-${n}</span>`; }
  if (k <= t.end) return `<span class="dtag on">여행 중</span>`; return `<span class="dtag gray">다녀옴</span>`; }
const fmt = s => String(s || '').replace(/-/g, '.');
function places(){ const m = new Map(); TRIPS.forEach(t => tripCountries(t).forEach(c => { if (!C[c]) return; if (!m.has(c)) m.set(c, {k:c, ...C[c], trips:[]}); m.get(c).trips.push(t); })); return [...m.values()]; }
const go = id => { location.href = 'app.html#trip=' + encodeURIComponent(id); };
function trow(t){ const cs = tripCountries(t).map(c => C[c] ? C[c].n : c).join(' · ');
  return `<a class="card trow" href="app.html#trip=${encodeURIComponent(t.id)}"><div class="th">${tripThumbSVG(t, '-r' + t.id)}</div><div class="tx"><b>${esc(t.title)}</b><small>${fmt(t.start)} – ${fmt(t.end).slice(5)} · ${nights(t)}박 ${days(t)}일</small></div>${dtag(t)}</a>`; }

function render(){
  const P = places(), sorted = TRIPS.slice().sort((a, b) => String(b.start).localeCompare(String(a.start)));
  if (!SEL || !P.some(p => p.k === SEL)) SEL = (P.find(p => p.trips.includes(sorted[0])) || P[0] || {}).k || null;
  const vb = $('#vbtn');
  vb.innerHTML = VIEW === 'map' ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg>목록으로 보기` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z M9 4v14 M15 6v14"/></svg>지도로 보기`;
  vb.classList.toggle('solid', VIEW === 'list');
  const nDays = TRIPS.reduce((a, t) => a + (t.start && t.end ? days(t) : 0), 0);
  const stats = `<div class="stats"><div><small>여행</small><b>${TRIPS.length}번</b></div><div><small>나라·지역</small><b>${P.length}곳</b></div><div><small>여행한 날</small><b>${nDays}일</b></div></div>`;
  const foot = `<div class="foot"><button onclick="lockNow()">이 기기에서 잠그기</button></div>`;
  if (VIEW === 'list'){
    $('#main').innerHTML = `<div class="pt listpt"><div><h1>여행 목록</h1><small>최근 여행부터 보여요 · 누르면 그 여행으로 들어가요</small></div></div>
      <div class="grid">${sorted.map(t => `<div class="card tcard"><a href="app.html#trip=${encodeURIComponent(t.id)}">${tripThumbSVG(t, '-g' + t.id)}</a><div class="ft"><span>${esc(tripCountries(t).map(c => C[c] ? C[c].n : c).join(' · ') || t.title)}</span>${dtag(t)}<a class="edit" href="app.html#edittrip=${encodeURIComponent(t.id)}" title="포스터·여행 정보 수정" aria-label="수정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z M14 6l4 4"/></svg></a></div></div>`).join('')}
        <a class="newc" href="app.html#newtrip"><img src="${IMG.i.luggage}" alt=""><span>다음 여행은 어디로?</span></a></div>${foot}`;
    return;
  }
  const sp = P.find(p => p.k === SEL);
  const crop = !isWeb() && !FULL ? cropFor(P) : null;
  const list = sp ? `<div class="sec"><b>${esc(sp.n)}</b><span>여행 ${sp.trips.length}</span></div>${sp.trips.slice().sort((a, b) => String(b.start).localeCompare(String(a.start))).map(trow).join('')}`
    : `<div class="card empty">아직 핀이 없어요. 여행을 만들면 여기 나라가 찍혀요</div>`;
  const mapc = `<div class="card mapc">${mapSVG(P, SEL, crop)}${P.length ? `<button class="pill full" onclick="FULL=!FULL;render()">${FULL ? '가까이 보기' : '전체 지도'}</button>` : ''}</div>`;
  const pt = `<div class="pt"><div><h1>다녀온 곳</h1><small>핀을 누르면 그곳의 여행이 ${isWeb() ? '오른쪽에' : '아래에'} 보여요</small></div></div>`;
  $('#main').innerHTML = isWeb() ? `<div class="wrap"><div>${pt}${mapc}</div><div class="side">${stats}${list}</div></div>${foot}` : `${pt}${mapc}${stats}${list}${foot}`;
  document.querySelectorAll('.pin').forEach(b => b.onclick = () => { SEL = b.dataset.k; render(); });
}
$('#vbtn').onclick = () => { VIEW = VIEW === 'map' ? 'list' : 'map'; render(); scrollTo(0, 0); };
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (!$('#app').hidden) render(); }, 200); });

/* ---------- 서버 ---------- */
async function api(key){ const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({api:'load', key, trip: store.get('trip', 'honewmoon')})});
  const j = await r.json(); if (!j.ok) throw new Error(j.error || '실패'); return j.data; }
function openApp(){ $('#lock').classList.add('out'); $('#app').hidden = false; render(); setTimeout(() => $('#lock').hidden = true, 500); }
async function refresh(key){ const d = await api(key); if (d.trips){ TRIPS = d.trips; store.set('trips', TRIPS); } if (d.trip) store.set('trip', d.trip); if (!$('#app').hidden) render(); }
$('#pwf').onsubmit = async e => { e.preventDefault(); const k = $('#pw').value.trim(); if (!k) return;
  $('#pwb').disabled = true; $('#err').textContent = '';
  try { await refresh(k); store.set('key', k); openApp(); }
  catch (err){ $('#err').textContent = /BAD_KEY/.test(err.message) ? '비밀번호가 맞지 않아요' : '연결이 안 돼요. 잠시 뒤 다시 해 주세요'; }
  $('#pwb').disabled = false; };
function lockNow(){ store.set('key', ''); location.reload(); }
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) $('#hint').hidden = true;
(function init(){ const k = store.get('key', '');
  if (location.hash === '#bad'){ $('#err').textContent = '비밀번호를 다시 넣어 주세요'; history.replaceState(null, '', location.pathname); store.set('key', ''); return; }
  if (k){ if (TRIPS.length) openApp(); refresh(k).then(() => { if ($('#app').hidden) openApp(); }).catch(err => { if (/BAD_KEY/.test(err.message)){ store.set('key', ''); location.reload(); } }); }
})();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
